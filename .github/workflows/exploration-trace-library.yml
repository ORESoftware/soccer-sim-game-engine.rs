name: Exploration trace library

on:
  pull_request:
    paths:
      - 'src/des/general/exploration_trace.rs'
      - 'src/des/general/mod.rs'
      - 'docs/den-862-exploration-trace-library.md'
      - '.github/workflows/exploration-trace-library.yml'
  push:
    branches: [main]
    paths:
      - 'src/des/general/exploration_trace.rs'
      - 'src/des/general/mod.rs'
      - 'docs/den-862-exploration-trace-library.md'
      - '.github/workflows/exploration-trace-library.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2 # stable
      - name: Compile standalone module tests
        run: rustc --edition=2021 --test src/des/general/exploration_trace.rs -o /tmp/exploration-trace-tests
      - name: Run exploration trace tests
        run: /tmp/exploration-trace-tests
